# Tool pins for this repo's recipes, assembled from gator's standard/mise.toml
# (seed gator-rga). `just setup` runs `mise install`. Pins are major-only and copied byte
# for byte from the standard. rubocop travels in the Gemfile, mdformat runs through uvx,
# and the Rust toolchain is pinned by rust-toolchain.toml.

[tools]
just = "1"
uv = "0"
"aqua:numtide/treefmt" = "2"
node = "24"
prettier = "3"
taplo = "0"
shellcheck = "0"
"aqua:rhysd/actionlint" = "1"
zizmor = "1"
cocogitto = "7"
pinact = "5"
git-cliff = "2"
